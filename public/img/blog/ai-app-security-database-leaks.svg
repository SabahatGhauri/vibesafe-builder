<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="A browser view-source panel showing a database API key hardcoded in client-side JavaScript, which anyone visiting the page can read.">
  <defs>
    <style>
      .t  { fill:#eef3f7; font:600 16px "Segoe UI",system-ui,sans-serif; }
      .d  { fill:#8d9aa8; font:400 13px "Segoe UI",system-ui,sans-serif; }
      .cap{ fill:#5f6b78; font:400 12.5px "Segoe UI",system-ui,sans-serif; }
      .lbl{ fill:#ff6b6b; font:700 11px "Segoe UI",system-ui,sans-serif; letter-spacing:.6px; }
      .c  { font:400 13px "Cascadia Code",Consolas,monospace; fill:#8d9aa8; }
      .ck { fill:#8b5cf6; }
      .cs { fill:#cfe3d8; }
      .gut{ font:400 12px "Cascadia Code",Consolas,monospace; fill:#3c4855; }
    </style>
  </defs>
  <rect width="1000" height="420" rx="16" fill="#0f1318"/>
  <text x="40" y="46" class="lbl">WHAT A VISITOR CAN READ</text>

  <!-- browser chrome -->
  <rect x="40" y="64" width="920" height="268" rx="12" fill="#141a21" stroke="#232b34"/>
  <rect x="40" y="64" width="920" height="38" rx="12" fill="#0f1318"/>
  <rect x="40" y="90" width="920" height="12" fill="#0f1318"/>
  <circle cx="64" cy="83" r="5" fill="#ff6b6b"/><circle cx="82" cy="83" r="5" fill="#f0b84e"/><circle cx="100" cy="83" r="5" fill="#3f8f5f"/>
  <text x="124" y="88" class="cap">view-source: your-app.example.com  ·  anyone can open this</text>
  <line x1="40" y1="102" x2="960" y2="102" stroke="#232b34"/>

  <!-- code -->
  <g>
    <text x="62" y="134" class="gut">14</text><text x="100" y="134" class="c"><tspan class="ck">const</tspan> db = createClient(</text>
    <text x="62" y="160" class="gut">15</text><text x="100" y="160" class="c">  <tspan class="cs">"https://xyzco.supabase.co"</tspan>,</text>
    <!-- highlighted line -->
    <rect x="48" y="170" width="904" height="30" rx="6" fill="#ff6b6b" fill-opacity=".10"/>
    <rect x="48" y="170" width="3" height="30" rx="2" fill="#ff6b6b"/>
    <text x="62" y="190" class="gut">16</text><text x="100" y="190" class="c">  <tspan fill="#ff8b8b">"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiJ9…"</tspan></text>
    <text x="690" y="190" class="c" fill="#ff6b6b">◂ your database key</text>
    <text x="62" y="222" class="gut">17</text><text x="100" y="222" class="c">);</text>
    <text x="62" y="254" class="gut">18</text><text x="100" y="254" class="c"><tspan class="ck">const</tspan> { data } = <tspan class="ck">await</tspan> db.from(<tspan class="cs">"users"</tspan>).select(<tspan class="cs">"*"</tspan>);</text>
    <text x="62" y="292" class="gut">  </text><text x="100" y="292" class="d">No row-level security policy — so that key reads every row.</text>
  </g>

  <text x="40" y="368" class="cap">This is the Moltbook failure, exactly: a key in client-side JavaScript plus no access-control policy behind it.</text>
  <text x="40" y="392" class="cap">It runs. The demo looks finished. Nothing in the chat window tells you the table is public.</text>
</svg>
