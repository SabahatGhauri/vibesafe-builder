<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="The pre-launch checklist grouped into three stages: before you build, while you build, and before you publish.">
  <defs>
    <style>
      .t  { fill:#eef3f7; font:600 15px "Segoe UI",system-ui,sans-serif; }
      .d  { fill:#8d9aa8; font:400 12.5px "Segoe UI",system-ui,sans-serif; }
      .cap{ fill:#5f6b78; font:400 12.5px "Segoe UI",system-ui,sans-serif; }
      .lbl{ fill:#8b5cf6; font:700 11px "Segoe UI",system-ui,sans-serif; letter-spacing:.6px; }
      .stage { fill:#5f6b78; font:700 10.5px "Segoe UI",system-ui,sans-serif; letter-spacing:.8px; }
    </style>
    <symbol id="tick" viewBox="0 0 20 20">
      <rect x="1" y="1" width="18" height="18" rx="5" fill="none" stroke="#8b5cf6" stroke-width="1.6"/>
      <path d="M5.5 10.2 L8.7 13.4 L14.5 6.8" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
  <rect width="1000" height="420" rx="16" fill="#0f1318"/>
  <text x="40" y="46" class="lbl">25 CHECKS, THREE STAGES</text>
  <text x="40" y="76" class="t" style="font-size:18px">What to check, and the stage it belongs to</text>

  <g>
    <rect x="40" y="100" width="296" height="232" rx="12" fill="#141a21" stroke="#232b34"/>
    <text x="62" y="128" class="stage">BEFORE YOU BUILD</text>
    <use href="#tick" x="62" y="146" width="18" height="18"/><text x="90" y="160" class="d">Know what a generation costs</text>
    <use href="#tick" x="62" y="180" width="18" height="18"/><text x="90" y="194" class="d">Set a spend cap you choose</text>
    <use href="#tick" x="62" y="214" width="18" height="18"/><text x="90" y="228" class="d">Write down what must stay true</text>
    <use href="#tick" x="62" y="248" width="18" height="18"/><text x="90" y="262" class="d">Decide where the data lives</text>
    <text x="62" y="306" class="cap">7 checks in this stage</text>

    <rect x="352" y="100" width="296" height="232" rx="12" fill="#141a21" stroke="#232b34"/>
    <text x="374" y="128" class="stage">WHILE YOU BUILD</text>
    <use href="#tick" x="374" y="146" width="18" height="18"/><text x="402" y="160" class="d">Save a version that works</text>
    <use href="#tick" x="374" y="180" width="18" height="18"/><text x="402" y="194" class="d">Stop after two failed fixes</text>
    <use href="#tick" x="374" y="214" width="18" height="18"/><text x="402" y="228" class="d">Roll back instead of re-prompting</text>
    <use href="#tick" x="374" y="248" width="18" height="18"/><text x="402" y="262" class="d">Change one thing per turn</text>
    <text x="374" y="306" class="cap">7 checks in this stage</text>

    <rect x="664" y="100" width="296" height="232" rx="12" fill="#141a21" stroke="#8b5cf6" stroke-opacity=".45"/>
    <text x="686" y="128" class="stage" fill="#8b5cf6">BEFORE YOU PUBLISH</text>
    <use href="#tick" x="686" y="146" width="18" height="18"/><text x="714" y="160" class="d">No keys in client-side code</text>
    <use href="#tick" x="686" y="180" width="18" height="18"/><text x="714" y="194" class="d">Ask what a stranger could read</text>
    <use href="#tick" x="686" y="214" width="18" height="18"/><text x="714" y="228" class="d">Open it like a real visitor would</text>
    <use href="#tick" x="686" y="248" width="18" height="18"/><text x="714" y="262" class="d">Keep a copy you control</text>
    <text x="686" y="306" class="cap">11 checks in this stage</text>
  </g>

  <text x="40" y="376" class="cap">Most launch incidents in AI-built apps come from the third column — the stage people skip because the preview already looked finished.</text>
</svg>
